appId: io.github.lycheeplayer
productName: Lychee Player
directories:
  output: dist
  buildResources: build
electronLanguages:
  - zh-CN
  - en-US
files:
  - out/**/*
  - package.json
  - LICENSE
  - "!**/*.map"
extraResources:
  - from: resources
    to: .
    filter:
      - icon.png
      - tray.png
      - licenses/**
linux:
  target:
    - dir
  category: AudioVideo
  executableName: lychee-player
  icon: build/icon.png
